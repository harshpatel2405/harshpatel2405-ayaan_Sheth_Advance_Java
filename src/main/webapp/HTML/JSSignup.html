<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Signup Page</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: inline-block;
            width: 100px;
            margin-bottom: 15px;
        }

        input {
            padding: 8px;
            width: 230px;
            margin-bottom: 10px;
        }

        input[type="radio"] {
            width: auto;
        }

        .gender {
            width: auto;
        }

        .btn {
            width: 100%;
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: #0b7dda;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Sign Up Page</h1>

        <form action="../jsSignupServlet" method="post">

            <label>Name:</label>
            <input type="text" name="name">
            <br>

            <label>ID:</label>
            <input type="text" name="id">
            <br>

            <label>Email:</label>
            <input type="email" name="email">
            <br>

            <label>Age:</label>
            <input type="number" name="age">
            <br>

            <label>Gender:</label>

            <input type="radio" name="gender" value="Male">
            <span>Male</span>

            <input type="radio" name="gender" value="Female">
            <span>Female</span>

            <br><br>

            <label>Password:</label>
            <input type="password" name="password">
            <br><br>

            <input class="btn" type="submit" value="Sign Up">

        </form>

    </div>

</body>

</html>
